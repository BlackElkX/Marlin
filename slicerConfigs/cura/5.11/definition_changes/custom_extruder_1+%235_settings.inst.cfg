[general]
version = 4
name = custom_extruder_1 #5_settings
definition = custom_extruder_1

[metadata]
type = definition_changes
setting_version = 25

[values]
machine_extruder_end_code = ;begin stop-code for extruder
	G92 E0                                         ;Set the current position for the extruder as zero.
	G1 E-25 F2700                                  ;finish extruding, by retracting 25mm
	G92 E0                                         ;Set the current position for the extruder as zero.
	;end stop-code for extruder
machine_extruder_start_code = ;begin start-code for extruder
	G92 E0                                         ;Set the current position for the extruder as zero.
	G1 E25 F2700                                   ;extrude 25 mm filament
	G92 E0                                         ;Set the current position for the extruder as zero.
	;end start-code for extruder
material_diameter = 1.75

