	;G92 E0                                         ;Set the current position for extruder 3 as zero.
	;G0 X7.71  Y208.37 Z0.0   F2700.0               ;move out of printing area
	;G1 Y268.37  E60                                ;extrude 60 mm filament
	;G1 Y320.0 E-12.5 F500.0                        ;finish extruding, by retracting
