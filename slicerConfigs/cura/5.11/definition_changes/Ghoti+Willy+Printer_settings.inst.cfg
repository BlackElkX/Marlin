[general]
version = 4
name = Ghoti Willy Printer_settings
definition = custom

[metadata]
type = definition_changes
setting_version = 25

[values]
extruders_enabled_count = 1
gantry_height = 52.0
machine_depth = 316.0
machine_end_gcode = ;begin of stop-code printer
	;extruder 3
	T2                                             ;tool change to extruder 3
	G92 E0                                         ;Set the current position for extruder 3 as zero.
	G1 E-25 F2700                                  ;finish extruding, by retracting 25mm
	T1                                             ;tool change to extruder 2
	G92 E0                                         ;Set the current position for extruder 2 as zero.
	G1 E-25 F2700                                  ;finish extruding, by retracting 25mm
	T0                                             ;tool change to extruder 1
	G92 E0                                         ;Set the current position for extruder 1 as zero.
	G1 E-25 F2700                                  ;finish extruding, by retracting 25mm
	M104 S0 T2                                     ;set hotend 3 temperature to zero
	M104 S0 T1                                     ;set hotend 2 temperature to zero
	M104 S0 T0                                     ;set hotend 1 temperature to zero
	M140 S0                                        ;set bed temperature to zero
	G0 X300 Y300                                   ;move head to oposite side of home
	;G0 X0 Y0                                       ;move head to 0
	G91                                            ;set incremental mode
	G1 Z10                                         ;move Z 10mm up
	M84                                            ;disable the steppers
	;end of stop-code for printer
machine_extruder_count = 3
machine_heated_bed = True
machine_height = 270.0
machine_start_gcode = ;begin of start-code printer
	G21                                            ;milimeter units
	G90                                            ;absolute x and y positioning
	M82                                            ;absolute extruder positioning
	M140 S{material_bed_temperature}               ;set bed temperature
	M104 S{material_print_temperature, 0} T0       ;set hotend 1 temperature
	M104 S{material_print_temperature, 1} T1       ;set hotend 2 temperature
	M104 S{material_print_temperature, 2} T2       ;set hotend 3 temperature
	G28                                            ;home
	;G0 X330 Y316                                   ;move head to oposite side of home
	G0 X0 Y0                                       ;move head to 0
	;M107 T0                                       ;set fan off
	G29                                            ;bed leveling
	M190 S{material_bed_temperature}               ;wait for bed temperature
	M109 S{material_print_temperature, 0} T0       ;wait for hotend temperature
	
	;extruder 1
	;T0                                             ;tool change to extruder 1
	;G92 E0                                         ;Set the current position for extruder 1 as zero.
	;G0 X1.0   Y0.0  Z0.0   F2700.0                 ;move extruder 1 to 0,1,0 and set feedrate
	;G1 Y60.0  E60                                  ;extrude 60 mm filament
	;G1 Y100.0 E-12.5 F500.0                        ;finish extruding, by retracting
	;;G92 E0                                         ;Set the current position for extruder 1 as zero.
	
	;extruder 2
	;T1                                             ;tool change to extruder 2
	;G92 E0                                         ;Set the current position for extruder 2 as zero.
	;G0 X5.71  Y98.37  Z0.0   F2700.0               ;move out of printing area
	;G1 Y158.37  E60                                ;extrude 60 mm filament
	;G1 Y210.0 E-12.5 F500.0                        ;finish extruding, by retracting
